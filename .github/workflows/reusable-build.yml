name: Reusable Build and Test

on:
  workflow_call: # This makes the workflow callable like a function!
    inputs:
      node-version:
        required: false
        type: string
        default: '20'
      run-lint:
        required: false
        type: boolean
        default: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linting
        if: ${{ inputs.run-lint }}
        run: echo "Linting code with Node ${{ inputs.node-version }}..."

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build