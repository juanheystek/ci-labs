name: Multi-Job CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# NEW: Global variables
env:
  APP_NAME: ci-labs
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Checking ${{ env.APP_NAME }} style..."

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NEW: Caching Step
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm # Where npm stores the downloaded files
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install dependencies
        run: npm ci # This is cleaner than 'npm install' for CI
        
      - run: npm test

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }} # Using the variable!
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-artifact
          path: dist/

  notify:
    name: Deploy Notification
    runs-on: ubuntu-latest
    needs: [build]
    environment: production # This links to the approval gate we will create!
    steps:
      - name: Use secret
        run: |
          echo "Deploying ${{ env.APP_NAME }}..."
          echo "Token length is ${#DEPLOY_TOKEN} characters"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}