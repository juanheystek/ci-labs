name: Node.js CI

on:
  push:
    branches: [main]
    paths:
      - '*.js'            # Only trigger if a Javascript file changes
      - 'package.json'    # Or if dependencies change
  pull_request:
    branches: [main]
  workflow_dispatch:      # This adds the "Run workflow" button!
    inputs:
      log_level:
        description: 'Log verbosity'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - warn

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
      
      # NEW STEP: Show the manual input
      - name: Show log level
        run: echo "Log level is ${{ github.event.inputs.log_level || 'not set' }}"